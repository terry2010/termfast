name: Release

# Build, sign and publish Tauri desktop bundles for Windows + macOS,
# create a GitHub Release, and deploy the updater manifest (latest.json)
# to the gh-pages branch so the in-app auto-updater can fetch it.
#
# Trigger: push a semver tag like v0.1.0

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.2)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

# M-2: restrict default token permissions at workflow level
permissions:
  contents: read

jobs:
  # === Build signed bundles for each desktop platform ===
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.platform == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check required secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing. See AGENTS.md § Release setup."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ matrix.platform }}-release-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-release-cargo-registry-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ matrix.platform }}-release-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-release-cargo-target-

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          # Tauri v2 on macOS usually has everything it needs on the runner,
          # but keep this step as a hook for future universal-binary tooling.
          true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri release bundle
        uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: "See the assets below to download this version."
          releaseDraft: true
          prerelease: false
          # Use the default branch name (not the commit SHA) as target_commitish.
          # The create-release API requires workflows:write permission when
          # target_commitish is a SHA whose diff vs the default branch includes
          # .github/workflows/ changes — and GITHUB_TOKEN cannot get that scope.
          # Using the branch name makes the diff empty, avoiding the 403.
          releaseCommitish: ${{ github.event.repository.default_branch }}
          args: ${{ matrix.args }}

      - name: Add README and fix-quarantine script to DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -e
          DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::warning::No DMG found, skipping README injection"
            exit 0
          fi
          echo "Found DMG: $DMG"

          # Convert read-only DMG to read-write DMG, then mount
          RW_DMG="${DMG%.dmg}-rw.dmg"
          hdiutil convert "$DMG" -format UDRW -o "$RW_DMG"
          MOUNT_POINT=$(hdiutil attach "$RW_DMG" -nobrowse -noautoopen | tail -1 | cut -f3)
          echo "Mounted at: $MOUNT_POINT"

          # Copy README and fix script to DMG root
          cp src-tauri/dmg-extras/README.txt "$MOUNT_POINT/"
          cp src-tauri/dmg-extras/fix-quarantine.command "$MOUNT_POINT/"
          chmod +x "$MOUNT_POINT/fix-quarantine.command"

          # Set DMG window layout via AppleScript: larger window + icon positions
          # so all 4 items (app, Applications, README, script) are visible at once.
          osascript <<EOF
          tell application "Finder"
            tell disk "$(basename "$MOUNT_POINT")"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {400, 100, 1000, 560}
              set theViewOptions to the icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 72
              set position of item "TermFast.app" of container window to {120, 80}
              set position of item "Applications" of container window to {480, 80}
              set position of item "README.txt" of container window to {120, 280}
              set position of item "fix-quarantine.command" of container window to {480, 280}
              close
            end tell
          end tell
          EOF

          # Unmount
          hdiutil detach "$MOUNT_POINT"

          # Re-compress as read-only DMG (replace original)
          rm -f "$DMG"
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG"
          rm -f "$RW_DMG"
          echo "✅ README and fix-quarantine.command added to DMG with custom layout"

      - name: Re-upload DMG with README to Release
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::warning::No DMG found, skipping re-upload"
            exit 0
          fi
          DMG_NAME=$(basename "$DMG")
          echo "Re-uploading $DMG_NAME to release ${{ inputs.tag || github.ref_name }}"
          gh release upload "${{ inputs.tag || github.ref_name }}" "$DMG" --clobber

  # === Build signed Android APK ===
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check required secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TERMFAST_STORE_PASSWORD: ${{ secrets.TERMFAST_STORE_PASSWORD }}
          TERMFAST_KEY_ALIAS: ${{ secrets.TERMFAST_KEY_ALIAS }}
          TERMFAST_KEY_PASSWORD: ${{ secrets.TERMFAST_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            echo "Run: base64 -i android/app/keystores/release.keystore"
            echo "Add the output as a GitHub Secret named ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "$TERMFAST_STORE_PASSWORD" ] || [ -z "$TERMFAST_KEY_ALIAS" ] || [ -z "$TERMFAST_KEY_PASSWORD" ]; then
            echo "::error::TERMFAST_STORE_PASSWORD / TERMFAST_KEY_ALIAS / TERMFAST_KEY_PASSWORD secrets are missing."
            echo "Add them in GitHub Settings → Secrets → Actions"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: android-release-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            android-release-cargo-registry-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target/aarch64-linux-android/
          key: android-release-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            android-release-cargo-target-

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystores
          # Remove any whitespace/newlines from the base64 string before decoding
          CLEANED=$(echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          echo "$CLEANED" | base64 --decode > android/app/keystores/release.keystore
          if [ ! -s android/app/keystores/release.keystore ]; then
            echo "::error::Keystore file is empty after decode. Check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          ls -la android/app/keystores/release.keystore
          file android/app/keystores/release.keystore

      - name: Build Rust .so (release)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.3.13750724
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.3.13750724
        run: |
          NDK_TOOLCHAIN="${ANDROID_SDK_ROOT}/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Remove the macOS-specific .cargo/config.toml so it doesn't interfere
          rm -f .cargo/config.toml
          # Set environment variables for cc/ring/openssl crates
          export CC_aarch64_linux_android="${NDK_TOOLCHAIN}/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="${NDK_TOOLCHAIN}/llvm-ar"
          export RANLIB_aarch64_linux_android="${NDK_TOOLCHAIN}/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_TOOLCHAIN}/aarch64-linux-android26-clang"

          cargo build --release --target aarch64-linux-android -p termfast-android-ffi
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libtermfast_android_ffi.so \
             android/app/src/main/jniLibs/arm64-v8a/libtermfast_android_ffi.so
          STRIP=$(find ${ANDROID_SDK_ROOT}/ndk -name llvm-strip -path '*linux-x86_64*' | head -1)
          if [ -n "$STRIP" ]; then
            "$STRIP" --strip-debug android/app/src/main/jniLibs/arm64-v8a/libtermfast_android_ffi.so
          fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          echo "TERMFAST_STORE_PASSWORD=${{ secrets.TERMFAST_STORE_PASSWORD }}" >> android/local.properties
          echo "TERMFAST_KEY_ALIAS=${{ secrets.TERMFAST_KEY_ALIAS }}" >> android/local.properties
          echo "TERMFAST_KEY_PASSWORD=${{ secrets.TERMFAST_KEY_PASSWORD }}" >> android/local.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PskipCargoBuild

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/TermFast-${VERSION}-android-arm64.apk

      - name: Compute APK SHA-256
        id: apk_sha
        run: |
          APK=$(ls android/TermFast-*-android-arm64.apk)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            See the assets below to download this version.

            **Android APK SHA-256:** `${{ steps.apk_sha.outputs.sha256 }}`
          draft: true
          prerelease: false
          files: android/TermFast-*-android-arm64.apk

  # === Generate latest.json from the signed release assets and deploy to gh-pages ===
  update-manifest:
    needs: [build, build-android]
    if: success()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20

      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: node scripts/generate-latest-json.mjs

      - name: Deploy latest.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

  # === Publish the draft release once the manifest is live ===
  publish-release:
    needs: update-manifest
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ inputs.tag || github.ref_name }} --draft=false --repo ${{ github.repository }}
