[package]
name = "termfast-app"
version = "0.4.11"
edition = "2021"
license = "Apache-2.0"
authors = ["TermFast Contributors"]

[lib]
name = "termfast_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-network = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
termfast-core = { workspace = true }
termfast-credential = { workspace = true }
termfast-daemon = { workspace = true }
base64 = { workspace = true }
zeroize = "1"
termfast-desktop = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sys-locale = "0.3.2"
os_info = "3"
whoami = "2"
reqwest = { workspace = true, features = ["json"] }
sha2 = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
termfast-cloud-sync = { workspace = true }
getrandom = "0.4.3"
p256 = { workspace = true }
x25519-dalek = { workspace = true }
rand = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", features = ["zbus-secret-service-keyring-store"] }

[dev-dependencies]
tempfile = { workspace = true }
